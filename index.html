<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body class="page">
    <div class="header">
      <img class="header__image" src="./eisenhower-matrix.jpg" alt="Eisenhower Matrix">
      <a class="header__link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </div>
    <div class="main-container">
      <div class="new-task">
        <label class="new-task__label" for="new-task">Add Item</label>
        <div class="new-task__wrapper">
          <input class="new-task__input" id="new-task" type="text">
          <button class="new-task__button">Add</button>
        </div>
      </div>
      <div class="task-list">
        <h3 class="task-list__title">Todo</h3>
        <ul class="task-list__items" id="incomplete-tasks">
          <li class="task">
            <input class="task__checkbox" type="checkbox">
            <label class="task__label">Pay Bills</label>
            <input class="task__input" type="text">
            <button class="task__edit-button">Edit</button>
            <button class="task__delete-button">
              <img class="task__delete-button-image" src="./remove.svg" alt="Remove Icon">
            </button>
          </li>
          <li class="task task--edit-mode">
            <input class="task__checkbox" type="checkbox">
            <label class="task__label">Go Shopping</label>
            <input class="task__input" type="text" value="Go Shopping">
            <button class="task__edit-button">Save</button>
            <button class="task__delete-button">
              <img class="task__delete-button-image" src="./remove.svg" alt="Remove Icon">
            </button>
          </li>
        </ul>
      </div>
      <div class="task-list">
        <h3 class="task-list__title">Completed</h3>
        <ul class="task-list__items task-list__items--completed" id="completed-tasks">
          <li class="task">
            <input class="task__checkbox" type="checkbox" checked>
            <label class="task__label">See the Doctor</label>
            <input class="task__input" type="text">
            <button class="task__edit-button">Edit</button>
            <button class="task__delete-button">
              <img class="task__delete-button-image" src="./remove.svg" alt="Remove Icon">
            </button>
          </li>
        </ul>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
